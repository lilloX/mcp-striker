[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-striker"
version = "1.0.0"
description = "Deterministic exploit validation for Model Context Protocol (MCP) servers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["mcp", "security", "red-team", "exploit-validation"]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12,<1.0",
    "rich>=13.0",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "pyyaml>=6.0",
    "jsonpath-ng>=1.6",
    "jinja2>=3.1",
]

# Optional: only needed to run the bundled demo target `real_vulnerable_server.py`
# (the official Python MCP SDK). Not required by mcp-striker itself or its tests.
[project.optional-dependencies]
demo = ["mcp>=1.0"]

[project.scripts]
mcp-striker = "mcp_striker.cli:app"

[tool.hatch.envs.default]
dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "pydantic>=2.0",
]

[tool.hatch.envs.default.scripts]
test     = "pytest tests/ -v --cov=mcp_striker --cov-report=term-missing"
lint     = "ruff check mcp_striker/ tests/"
typecheck = "mypy mcp_striker/"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "ASYNC", "RUF", "I"]

[tool.mypy]
strict          = true
python_version  = "3.12"
plugins         = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
